version: 2
updates:
  # 依存ライブラリは週1回まとめて確認する。PR ごとに CI（型・lint・テスト・ビルド・E2E・画面比較）が走る。
  # minor / patch は1つの PR にまとめ、major は個別の PR にする。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # @types/node の major は Node の major（package.json の engines.node）に合わせるため、自動更新の対象外にする。
    # Node を上げるときは engines.node と @types/node を手で揃える。食い違うと、
    # scripts/check-engines.mjs が install / CI で失敗するので、更新し忘れても気づける。
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
